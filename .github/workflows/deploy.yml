
name: Deploy to Compute Engine

on:
  workflow_run:
    workflows: ["Go CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-compose
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
  GCE_ZONE: ${{ secrets.GCE_ZONE }}
  CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}

    name: Build and deploy fresh RaftLab cluster
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GAR_REPOSITORY \
            GCE_INSTANCE \
            GCE_ZONE \
            CADDY_DOMAIN \
            WIF_PROVIDER \
            SERVICE_ACCOUNT
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing configuration: $name"
              exit 1
            fi
          done

          echo "Deployment configuration validated."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry authentication
        shell: bash
        run: |
          set -euo pipefail

          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet

      - name: Build and push Docker images
        shell: bash
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          PREFIX="${REGISTRY}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"

          RAFT_IMAGE="${PREFIX}/raftlab:${IMAGE_TAG}"
          DASHBOARD_IMAGE="${PREFIX}/raftlab-dashboard:${IMAGE_TAG}"

          echo "Building RaftLab backend..."

          docker build \
            -f deployments/Dockerfile \
            -t "$RAFT_IMAGE" .

          echo "Building RaftLab dashboard..."

          docker build \
            -f dashboard/Dockerfile \
            -t "$DASHBOARD_IMAGE" .

          echo "Pushing images..."

          docker push "$RAFT_IMAGE"
          docker push "$DASHBOARD_IMAGE"

          echo "Images published: $IMAGE_TAG"

      - name: Verify VM SSH and sudo
        shell: bash
        run: |
          set -euo pipefail

          gcloud compute ssh "$GCE_INSTANCE" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCE_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command='
              set -e
              whoami
              sudo -n true
              sudo -n docker compose version
              echo SSH_DOCKER_READY
            '

      - name: Deploy fresh RaftLab cluster
        shell: bash
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          PREFIX="${REGISTRY}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"

          RAFT_IMAGE="${PREFIX}/raftlab:${IMAGE_TAG}"
          DASHBOARD_IMAGE="${PREFIX}/raftlab-dashboard:${IMAGE_TAG}"

          TARGET="$GCE_INSTANCE"

          SSH_ARGS=(
            --project "$GCP_PROJECT_ID"
            --zone "$GCE_ZONE"
            --tunnel-through-iap
            --quiet
          )

          echo "Creating remote staging directory..."

          STAGING=$(
            gcloud compute ssh "$TARGET" \
              "${SSH_ARGS[@]}" \
              --command='mktemp -d /tmp/raftlab-release.XXXXXXXX'
          )

          STAGING="${STAGING//$'\r'/}"
          STAGING="${STAGING%$'\n'}"

          if [[ ! "$STAGING" =~ ^/tmp/raftlab-release\.[A-Za-z0-9]{8}$ ]]; then
            echo "::error::Invalid staging directory"
            exit 1
          fi

          cleanup() {
            gcloud compute ssh "$TARGET" \
              "${SSH_ARGS[@]}" \
              --command="rm -rf -- '$STAGING'" || true
          }

          trap cleanup EXIT

          echo "Uploading deployment configuration..."

          gcloud compute scp --recurse \
            deployments/configs \
            "$TARGET:$STAGING/" \
            "${SSH_ARGS[@]}"

          gcloud compute scp \
            deployments/docker-compose.production.yml \
            deployments/Caddyfile \
            deployments/deploy-production.sh \
            deployments/production_checks.py \
            "$TARGET:$STAGING/" \
            "${SSH_ARGS[@]}"

          RELEASE_ENV=$(
            printf \
              'RAFTLAB_IMAGE=%s\nDASHBOARD_IMAGE=%s\nIMAGE_TAG=%s\nCADDY_DOMAIN=%s\n' \
              "$RAFT_IMAGE" \
              "$DASHBOARD_IMAGE" \
              "$IMAGE_TAG" \
              "$CADDY_DOMAIN" | base64 -w0
          )

          echo "Executing deployment on Compute Engine..."

          if ! gcloud compute ssh "$TARGET" \
            "${SSH_ARGS[@]}" \
            --command="sudo -n bash '$STAGING/deploy-production.sh' '$IMAGE_TAG' '$RELEASE_ENV' '$STAGING'"; then
            echo "::error file=deployments/deploy-production.sh::Production deployment failed for $IMAGE_TAG. Check the VM output for configuration, volume, startup, or Raft readiness errors."
            exit 1
          fi

          echo "RaftLab deployment completed successfully."
