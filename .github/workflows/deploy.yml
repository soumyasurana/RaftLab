
name: Deploy to Compute Engine

on:
  workflow_run:
    workflows: ["Go CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-compose
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
  GCE_ZONE: ${{ secrets.GCE_ZONE }}
  CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}

    name: Build and deploy fresh RaftLab cluster
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GAR_REPOSITORY \
            GCE_INSTANCE \
            GCE_ZONE \
            CADDY_DOMAIN \
            WIF_PROVIDER \
            SERVICE_ACCOUNT
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing configuration: $name"
              exit 1
            fi
          done

          echo "Deployment configuration validated."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry authentication
        shell: bash
        run: |
          set -euo pipefail

          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet

      - name: Build and push Docker images
        shell: bash
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          PREFIX="${REGISTRY}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"

          RAFT_IMAGE="${PREFIX}/raftlab:${IMAGE_TAG}"
          DASHBOARD_IMAGE="${PREFIX}/raftlab-dashboard:${IMAGE_TAG}"

          echo "Building RaftLab backend..."

          docker build \
            -f deployments/Dockerfile \
            -t "$RAFT_IMAGE" .

          echo "Building RaftLab dashboard..."

          docker build \
            -f dashboard/Dockerfile \
            -t "$DASHBOARD_IMAGE" .

          echo "Pushing images..."

          docker push "$RAFT_IMAGE"
          docker push "$DASHBOARD_IMAGE"

          echo "Images published: $IMAGE_TAG"

      - name: Verify VM SSH and sudo
        shell: bash
        run: |
          set -euo pipefail

          gcloud compute ssh "$GCE_INSTANCE" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCE_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command='
              set -e
              whoami
              sudo -n true
              sudo -n docker compose version
              echo SSH_DOCKER_READY
            '

      - name: Deploy fresh RaftLab cluster
        shell: bash
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          PREFIX="${REGISTRY}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"

          RAFT_IMAGE="${PREFIX}/raftlab:${IMAGE_TAG}"
          DASHBOARD_IMAGE="${PREFIX}/raftlab-dashboard:${IMAGE_TAG}"

          TARGET="$GCE_INSTANCE"

          SSH_ARGS=(
            --project "$GCP_PROJECT_ID"
            --zone "$GCE_ZONE"
            --tunnel-through-iap
            --quiet
          )

          echo "Creating remote staging directory..."

          STAGING=$(
            gcloud compute ssh "$TARGET" \
              "${SSH_ARGS[@]}" \
              --command='mktemp -d /tmp/raftlab-release.XXXXXXXX'
          )

          STAGING="${STAGING//$'\r'/}"
          STAGING="${STAGING%$'\n'}"

          if [[ ! "$STAGING" =~ ^/tmp/raftlab-release\.[A-Za-z0-9]{8}$ ]]; then
            echo "::error::Invalid staging directory"
            exit 1
          fi

          cleanup() {
            gcloud compute ssh "$TARGET" \
              "${SSH_ARGS[@]}" \
              --command="rm -rf -- '$STAGING'" || true
          }

          REMOTE_SCRIPT=$(mktemp)
          trap 'rm -f "$REMOTE_SCRIPT"; cleanup' EXIT

          echo "Uploading deployment configuration..."

          gcloud compute scp --recurse \
            deployments/configs \
            "$TARGET:$STAGING/" \
            "${SSH_ARGS[@]}"

          gcloud compute scp \
            deployments/docker-compose.production.yml \
            deployments/Caddyfile \
            "$TARGET:$STAGING/" \
            "${SSH_ARGS[@]}"

          RELEASE_ENV=$(
            printf \
              'RAFTLAB_IMAGE=%s\nDASHBOARD_IMAGE=%s\nIMAGE_TAG=%s\nCADDY_DOMAIN=%s\n' \
              "$RAFT_IMAGE" \
              "$DASHBOARD_IMAGE" \
              "$IMAGE_TAG" \
              "$CADDY_DOMAIN" | base64 -w0
          )

          cat > "$REMOTE_SCRIPT" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail

          tag="$1"
          env_b64="$2"
          staging="$3"

          [[ "$tag" =~ ^[0-9a-f]{40}$ ]]
          [[ "$staging" =~ ^/tmp/raftlab-release\.[A-Za-z0-9]{8}$ ]]

          base="/opt/raftlab"
          release="$base/releases/$tag"
          project_file="$base/compose-project"
          current="$base/current"

          mkdir -p "$release/configs/docker"

          install -m 644 \
            "$staging"/configs/docker/*.yaml \
            "$release/configs/docker/"

          install -m 644 \
            "$staging/docker-compose.production.yml" \
            "$staging/Caddyfile" \
            "$release/"

          printf '%s' "$env_b64" | base64 -d > "$release/.env"
          chmod 600 "$release/.env"

          if [[ ! -s "$project_file" ]]; then
            echo "ERROR: Missing Compose project identity."
            exit 1
          fi

          project=$(cat "$project_file")

          if [[ "$project" != "deployments" ]]; then
            echo "ERROR: Unexpected Compose project: $project"
            exit 1
          fi

          compose_new() {
            docker compose \
              -p "$project" \
              --project-directory "$release" \
              --env-file "$release/.env" \
              -f "$release/docker-compose.production.yml" \
              "$@"
          }

          echo "======================================"
          echo "VALIDATING NEW RELEASE"
          echo "======================================"

          compose_new config --quiet

          echo "Pulling all images before stopping old containers..."
          compose_new pull

          echo "======================================"
          echo "STOPPING EXISTING RAFTLAB CLUSTER"
          echo "======================================"

          # First deployment may still use the original Compose
          # configuration under /opt/raftlab/deployments.
          # Discover the current Compose configuration from
          # the labels of existing containers.

          mapfile -t old_files < <(
            docker ps -a \
              --filter "label=com.docker.compose.project=$project" \
              --format '{{.Label "com.docker.compose.project.config_files"}}' \
              | tr ',' '\n' \
              | sed '/^$/d' \
              | sort -u
          )

          old_workdir=$(
            docker ps -a \
              --filter "label=com.docker.compose.project=$project" \
              --format '{{.Label "com.docker.compose.project.working_dir"}}' \
              | head -n 1
          )

          if (( ${#old_files[@]} > 0 )); then
            echo "Existing Compose files:"
            printf '%s\n' "${old_files[@]}"

            old_args=()

            for file in "${old_files[@]}"; do
              if [[ ! -f "$file" ]]; then
                echo "ERROR: Existing Compose file not found: $file"
                exit 1
              fi
              old_args+=(-f "$file")
            done

            if [[ -n "$old_workdir" ]]; then
              old_args=(--project-directory "$old_workdir" "${old_args[@]}")
            fi

            echo "Removing existing containers and volumes..."

            docker compose \
              -p "$project" \
              "${old_args[@]}" \
              down --volumes --remove-orphans

          else
            echo "No existing Compose containers found."
          fi

          echo "======================================"
          echo "STARTING FRESH RAFTLAB CLUSTER"
          echo "======================================"

          compose_new up \
            -d \
            --force-recreate \
            --remove-orphans

          echo "======================================"
          echo "VERIFYING DEPLOYMENT"
          echo "======================================"

          compose_new ps

          expected_services=$(compose_new config --services | sort)
          actual_services=$(compose_new ps --services --all | sort)

          if [[ "$expected_services" != "$actual_services" ]]; then
            echo "ERROR: Some expected services are missing."
            echo "Expected:"
            printf '%s\n' "$expected_services"
            echo "Actual:"
            printf '%s\n' "$actual_services"
            exit 1
          fi

          echo "Waiting for containers to stabilize..."

          sleep 20

          compose_new ps

          if compose_new ps --all --format json \
            | python3 -c '
          import json
          import sys

          raw = sys.stdin.read().strip()
          if not raw:
              sys.exit(1)

          try:
              data = json.loads(raw)
              if isinstance(data, dict):
                  data = [data]
          except json.JSONDecodeError:
              data = [json.loads(line) for line in raw.splitlines()]

          if not data:
              sys.exit(1)

          for container in data:
              name = container.get("Name", "unknown")
              state = container.get("State", "")
              health = container.get("Health", "")

              print(f"{name}: state={state}, health={health}")

              if state != "running":
                  sys.exit(1)

              if health and health != "healthy":
                  sys.exit(1)
          '; then
            echo "Container state checks passed."
          else
            echo "ERROR: One or more containers failed validation."
            exit 1
          fi

          ln -sfn "$release" "$base/current.next"
          mv -Tf "$base/current.next" "$current"

          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Commit: $tag"
          echo "Compose project: $project"
          echo "Release: $release"
          echo "Fresh cluster started successfully."
          REMOTE

          gcloud compute scp \
            "$REMOTE_SCRIPT" \
            "$TARGET:$STAGING/deploy.sh" \
            "${SSH_ARGS[@]}"

          echo "Executing deployment on Compute Engine..."

          gcloud compute ssh "$TARGET" \
            "${SSH_ARGS[@]}" \
            --command="sudo -n bash '$STAGING/deploy.sh' '$IMAGE_TAG' '$RELEASE_ENV' '$STAGING'"

          echo "RaftLab deployment completed successfully."
