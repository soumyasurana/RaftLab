
name: Deploy to Compute Engine

on:
  workflow_run:
    workflows: ["Go CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-compose
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
  GCE_ZONE: ${{ secrets.GCE_ZONE }}
  CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}

    name: Build and stage release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GAR_REPOSITORY \
            GCE_INSTANCE \
            GCE_ZONE \
            CADDY_DOMAIN \
            WIF_PROVIDER \
            SERVICE_ACCOUNT
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing configuration: $name"
              exit 1
            fi
          done

          echo "Deployment configuration validated."

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry authentication
        shell: bash
        run: |
          set -euo pipefail

          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" \
            --quiet

      - name: Build and push images
        shell: bash
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          PREFIX="${REGISTRY}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"

          RAFT_IMAGE="${PREFIX}/raftlab:${IMAGE_TAG}"
          DASHBOARD_IMAGE="${PREFIX}/raftlab-dashboard:${IMAGE_TAG}"

          echo "Building RaftLab backend..."
          docker build \
            --file deployments/Dockerfile \
            --tag "$RAFT_IMAGE" .

          echo "Building RaftLab dashboard..."
          docker build \
            --file dashboard/Dockerfile \
            --tag "$DASHBOARD_IMAGE" .

          echo "Publishing backend..."
          docker push "$RAFT_IMAGE"

          echo "Publishing dashboard..."
          docker push "$DASHBOARD_IMAGE"

          echo "Images published for commit ${IMAGE_TAG}"

      - name: Verify VM SSH and sudo
        shell: bash
        run: |
          set -euo pipefail

          gcloud compute ssh "$GCE_INSTANCE" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCE_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command='
              set -e
              echo SSH_CONNECTION_SUCCESSFUL
              whoami
              id
              sudo -n true
              echo SSH_AND_SUDO_OK
            '

      - name: Stage release through IAP
        shell: bash
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          PREFIX="${REGISTRY}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"

          RAFT_IMAGE="${PREFIX}/raftlab:${IMAGE_TAG}"
          DASHBOARD_IMAGE="${PREFIX}/raftlab-dashboard:${IMAGE_TAG}"

          TARGET="${GCE_INSTANCE}"

          SSH_ARGS=(
            --project "$GCP_PROJECT_ID"
            --zone "$GCE_ZONE"
            --tunnel-through-iap
            --quiet
          )

          echo "Creating remote staging directory..."

          STAGING=$(
            gcloud compute ssh "$TARGET" \
              "${SSH_ARGS[@]}" \
              --command='mktemp -d /tmp/raftlab-release.XXXXXXXX'
          )

          STAGING="${STAGING//$'\r'/}"
          STAGING="${STAGING%$'\n'}"

          if [[ ! "$STAGING" =~ ^/tmp/raftlab-release\.[A-Za-z0-9]{8}$ ]]; then
            echo "::error::Unexpected staging directory: $STAGING"
            exit 1
          fi

          echo "Staging directory: $STAGING"

          cleanup() {
            gcloud compute ssh "$TARGET" \
              "${SSH_ARGS[@]}" \
              --command="rm -rf -- '$STAGING'" || true
          }

          trap cleanup EXIT

          echo "Uploading deployment configurations..."

          gcloud compute scp --recurse \
            deployments/configs \
            "$TARGET:$STAGING/" \
            "${SSH_ARGS[@]}"

          gcloud compute scp \
            deployments/docker-compose.production.yml \
            deployments/Caddyfile \
            "$TARGET:$STAGING/" \
            "${SSH_ARGS[@]}"

          RELEASE_ENV=$(
            printf \
              'RAFTLAB_IMAGE=%s\nDASHBOARD_IMAGE=%s\nIMAGE_TAG=%s\nCADDY_DOMAIN=%s\n' \
              "$RAFT_IMAGE" \
              "$DASHBOARD_IMAGE" \
              "$IMAGE_TAG" \
              "$CADDY_DOMAIN" | base64 -w0
          )

          echo "Preparing release on Compute Engine..."

          # Transfer the remote script as a file. This avoids
          # depending on gcloud SSH heredoc stdin forwarding.
          REMOTE_SCRIPT=$(mktemp)
          trap 'rm -f "$REMOTE_SCRIPT"; cleanup' EXIT

          cat > "$REMOTE_SCRIPT" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail

          tag="$1"
          env_b64="$2"
          staging="$3"

          [[ "$tag" =~ ^[0-9a-f]{40}$ ]]
          [[ "$staging" =~ ^/tmp/raftlab-release\.[A-Za-z0-9]{8}$ ]]

          release="/opt/raftlab/releases/$tag"
          project_file="/opt/raftlab/compose-project"

          mkdir -p "$release/configs/docker"

          install -m 644 \
            "$staging"/configs/docker/*.yaml \
            "$release/configs/docker/"

          install -m 644 \
            "$staging/docker-compose.production.yml" \
            "$staging/Caddyfile" \
            "$release/"

          printf '%s' "$env_b64" | base64 -d > "$release/.env"
          chmod 600 "$release/.env"

          if [[ ! -s "$project_file" ]]; then
            echo "ERROR: Missing $project_file"
            echo "Set the existing Compose project name first."
            exit 1
          fi

          project=$(cat "$project_file")

          if [[ ! "$project" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "ERROR: Invalid Compose project name."
            exit 1
          fi

          compose_release() {
            docker compose \
              -p "$project" \
              --project-directory "$release" \
              --env-file "$release/.env" \
              -f "$release/docker-compose.production.yml" \
              "$@"
          }

          echo "Validating Compose configuration..."
          compose_release config --quiet

          echo "Checking Docker registry authentication..."
          if ! docker pull "$(grep '^RAFTLAB_IMAGE=' "$release/.env" | cut -d= -f2-)"; then
            echo "ERROR: VM cannot pull from Artifact Registry."
            echo "Configure VM registry credentials and permissions."
            exit 1
          fi

          echo "Pulling release images..."
          compose_release pull

          echo "Release staged successfully: $release"
          echo "Compose project: $project"
          echo "All release images downloaded."
          echo "No running Raft services were restarted."
          echo "Activation requires a coordinated upgrade."
          REMOTE

          gcloud compute scp \
            "$REMOTE_SCRIPT" \
            "$TARGET:$STAGING/deploy.sh" \
            "${SSH_ARGS[@]}"

          gcloud compute ssh "$TARGET" \
            "${SSH_ARGS[@]}" \
            --command="sudo -n bash '$STAGING/deploy.sh' '$IMAGE_TAG' '$RELEASE_ENV' '$STAGING'"

          echo "Release staging completed successfully."
