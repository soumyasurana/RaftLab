
name: Deploy to Compute Engine

on:
  workflow_run:
    workflows: ["Go CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-compose
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
  GCE_INSTANCE: ${{ secrets.GCE_INSTANCE }}
  GCE_ZONE: ${{ secrets.GCE_ZONE }}
  GCE_DEPLOY_USER: ${{ secrets.GCE_DEPLOY_USER }}
  CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GAR_REPOSITORY \
            GCE_INSTANCE \
            GCE_ZONE \
            GCE_DEPLOY_USER \
            CADDY_DOMAIN \
            WIF_PROVIDER \
            SERVICE_ACCOUNT
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing configuration: $name"
              exit 1
            fi
          done

          echo "Deployment configuration validated."

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push images
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          PREFIX="${REGISTRY}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"

          RAFT_IMAGE="${PREFIX}/raftlab:${IMAGE_TAG}"
          DASHBOARD_IMAGE="${PREFIX}/raftlab-dashboard:${IMAGE_TAG}"

          docker build \
            --file deployments/Dockerfile \
            --tag "$RAFT_IMAGE" .

          docker build \
            --file dashboard/Dockerfile \
            --tag "$DASHBOARD_IMAGE" .

          docker push "$RAFT_IMAGE"
          docker push "$DASHBOARD_IMAGE"

          echo "Images published for ${IMAGE_TAG}"

      - name: Stage release through IAP
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          PREFIX="${REGISTRY}/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"

          RAFT_IMAGE="${PREFIX}/raftlab:${IMAGE_TAG}"
          DASHBOARD_IMAGE="${PREFIX}/raftlab-dashboard:${IMAGE_TAG}"

          TARGET="${GCE_DEPLOY_USER}@${GCE_INSTANCE}"

          SSH_ARGS=(
            --zone "$GCE_ZONE"
            --tunnel-through-iap
            --quiet
          )

          STAGING=$(
            gcloud compute ssh "$TARGET" \
              "${SSH_ARGS[@]}" \
              --command='mktemp -d /tmp/raftlab-release.XXXXXXXX'
          )

          [[ "$STAGING" =~ ^/tmp/raftlab-release\.[[:alnum:]]{8}$ ]]

          cleanup() {
            gcloud compute ssh "$TARGET" \
              "${SSH_ARGS[@]}" \
              --command="rm -rf -- '$STAGING'" || true
          }
          trap cleanup EXIT

          gcloud compute scp --recurse \
            deployments/configs \
            "$TARGET:$STAGING/" \
            "${SSH_ARGS[@]}"

          gcloud compute scp \
            deployments/docker-compose.production.yml \
            deployments/Caddyfile \
            "$TARGET:$STAGING/" \
            "${SSH_ARGS[@]}"

          RELEASE_ENV=$(
            printf \
              'RAFTLAB_IMAGE=%s\nDASHBOARD_IMAGE=%s\nIMAGE_TAG=%s\nCADDY_DOMAIN=%s\n' \
              "$RAFT_IMAGE" \
              "$DASHBOARD_IMAGE" \
              "$IMAGE_TAG" \
              "$CADDY_DOMAIN" | base64 -w0
          )

          gcloud compute ssh "$TARGET" \
            "${SSH_ARGS[@]}" \
            --command="sudo bash -s -- '$IMAGE_TAG' '$RELEASE_ENV' '$STAGING'" <<'REMOTE'
          set -euo pipefail

          tag="$1"
          env_b64="$2"
          staging="$3"

          release="/opt/raftlab/releases/$tag"
          current="/opt/raftlab/current"

          mkdir -p "$release/configs/docker"

          install -m 644 \
            "$staging"/configs/docker/*.yaml \
            "$release/configs/docker/"

          install -m 644 \
            "$staging/docker-compose.production.yml" \
            "$staging/Caddyfile" \
            "$release/"

          printf '%s' "$env_b64" | base64 -d > "$release/.env"
          chmod 600 "$release/.env"

          # Pin the existing Compose project identity.
          # Set this on the VM before deployment.
          project_file="/opt/raftlab/compose-project"

          if [[ ! -s "$project_file" ]]; then
            echo "Missing $project_file"
            echo "Identify the existing Compose project before deployment."
            exit 1
          fi

          project=$(cat "$project_file")

          [[ "$project" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || exit 1

          compose_release() {
            docker compose \
              -p "$project" \
              --project-directory "$release" \
              --env-file "$release/.env" \
              -f "$release/docker-compose.production.yml" \
              "$@"
          }

          # Verify registry access and download images.
          # VM Docker authentication must be configured beforehand.
          compose_release pull

          # Validate the Compose configuration without restarting services.
          compose_release config --quiet

          # Do not automatically restart a live Raft cluster.
          # The new no-op log entry requires a coordinated upgrade.
          echo "Release staged successfully: $release"
          echo "Images pulled and Compose configuration validated."
          echo "Activation requires a coordinated Raft upgrade."
          REMOTE
